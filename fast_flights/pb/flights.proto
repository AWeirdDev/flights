syntax = "proto3";

message Airport {
  string airport = 2;
}

message FlightData {
  string date = 2;
  Airport from_airport = 13;
  Airport to_airport = 14;
  optional int32 max_stops = 5;
  repeated string airlines = 6;
  optional int32 earliest_departure_hour = 8;
  optional int32 latest_departure_hour = 9;
  optional int32 earliest_arrival_hour = 10;
  optional int32 latest_arrival_hour = 11;
  optional int32 max_duration_minutes = 12;
  repeated string connecting_airports = 15;
  optional int32 min_layover_minutes = 17;
  optional int32 max_layover_minutes = 18;
  repeated Emissions emissions = 19;
}

enum Emissions {
  UNKNOWN_EMISSIONS = 0;
  LESS_EMISSIONS = 1;
}

enum Seat {
  UNKNOWN_SEAT = 0;
  ECONOMY = 1;
  PREMIUM_ECONOMY = 2;
  BUSINESS = 3;
  FIRST = 4;
}

enum Trip {
  UNKNOWN_TRIP = 0;
  ROUND_TRIP = 1;
  ONE_WAY = 2;
  MULTI_CITY = 3; // not implemented
}

enum Passenger {
  UNKNOWN_PASSENGER = 0;
  ADULT = 1;
  CHILD = 2;
  INFANT_IN_SEAT = 3;
  INFANT_ON_LAP  = 4;
}

message Baggage {
  optional int32 carry_on_bags = 2;
  optional int32 checked_bags = 3;
}

message Info {
  repeated FlightData data = 3;
  Seat seat = 9;
  repeated Passenger passengers = 8;
  optional int32 max_price = 12;
  Baggage baggage = 13;
  optional bool hide_separate_and_self_transfer = 17;
  Trip trip = 19;
  optional bool exclude_basic_economy = 25;
}

message Price {
  int32 price = 1;
  string currency = 3;
}

message ItinerarySummary {
  string flights = 2;
  Price price = 3;
}
